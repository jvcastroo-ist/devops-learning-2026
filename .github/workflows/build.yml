name: Build Docker Image

on: 
  push: 
    branches: [main]
  workflow_dispatch: # manual button to test

jobs: 
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show build info 
        run: |
          echo "🚀 Building commit: ${{ github.sha }}"
          echo "📦 Repository: ${{ github.repository }}"
          echo "👤 Triggered by: ${{ github.actor }}"
      
      - name: Build Docker Image
        run: |
          docker build -t portfolio:${{ github.sha }} .
          echo "✅ Image built successfully!"
      
      - name: List Docker images
        run: docker images | grep portfolio

      - name: Test Docker image
        run: |
          docker run -d -p 8080:80 --name test-container portfolio:${{ github.sha }}
          
          sleep 5
          
          curl -f http://localhost:8080 || (docker logs test-container && exit 1)
          
          docker stop test-container
          docker rm test-container
          
          echo "✅ Container is working!"
